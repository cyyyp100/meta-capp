# Release (P3 du plan) — le « prod » d'une app desktop est un BINAIRE publié.
#
# Déclenchement : tag `v*` (ex. v1.4.0-beta.1 -> canal beta ; v1.4.0 -> stable).
# Gate : tests backend+frontend ET scans sécurité verts, puis build PyInstaller
# sur macOS (Apple Silicon ET Intel), Windows et Linux, signature si les
# secrets sont configurés, SMOKE TEST du binaire réel signé (--server-only +
# /api/health), notarisation macOS, puis publication GitHub Release UNIQUE (job `publish`) regroupant toutes les
# archives — les builds ne publient pas eux-mêmes pour éviter toute course sur
# la création de la Release.
#
# Une archive par plateforme (architecture/19-plateformes-et-materiel.md) :
#   macos-arm64   macos-14        — Mac Apple Silicon (M1 et suivants)
#   macos-x86_64  macos-15-intel  — Mac Intel ; DERNIER runner Intel de GitHub,
#                                   retiré en août 2027 : au-delà, Mac Intel =
#                                   installation depuis les sources
#   windows       windows-latest  — Windows 10/11 x64 (WebView2)
#   linux-x86_64  ubuntu-22.04    — glibc 2.35 : la plus ancienne image dispo,
#                                   donc la compatibilité la plus large ; s'ouvre
#                                   dans le navigateur (aucun moteur GTK/Qt gelé)
#
# Secrets optionnels (sans eux le binaire est publié NON signé, canal beta only) :
#   macOS   : MACOS_CERT_P12 (base64 du .p12 « Developer ID Application »),
#             MACOS_CERT_PASSWORD ; notarisation par clé d'API App Store Connect
#             (recommandé) APPLE_API_KEY_P8 (base64 du .p8), APPLE_API_KEY_ID,
#             APPLE_API_ISSUER_ID — ou par identifiant Apple : APPLE_ID,
#             APPLE_TEAM_ID, APPLE_APP_PASSWORD (mot de passe d'app).
#   Windows : Azure Artifact Signing (ex-Trusted Signing) — AZURE_TENANT_ID,
#             AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, ARTIFACT_SIGNING_ENDPOINT,
#             ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE. Plus de
#             certificat .pfx : depuis juin 2023 la clé d'un certificat de
#             signature de code doit rester dans un HSM (CA/Browser Forum).
# Rollback : les releases précédentes restent téléchargeables sur la page Releases.
name: Release

on:
  push:
    tags: ["v*"]

# Moindre privilège par défaut : seul `publish` écrit (contents: write). Toutes
# les actions sont épinglées par SHA — ce workflow manipule les certificats de
# signature et produit ce que les utilisateurs installent (architecture/13 § 4).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
      # Le tag publié DOIT être la version que le binaire annonce. Sinon la
      # vérification de mise à jour compare deux numéros qui ne parlent pas de la
      # même chose : un binaire v1.4.0 compilé avec APP_VERSION 1.3.0 se
      # proposerait indéfiniment sa propre mise à jour. Pré-release : v1.4.0-beta.1
      # doit correspondre à APP_VERSION 1.4.0.
      - name: Le tag correspond à APP_VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"
          APP=$(python -c "import sys; sys.path.insert(0, 'nwol'); from server.config import APP_VERSION; print(APP_VERSION)")
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ≠ APP_VERSION $APP (nwol/server/config.py)"
            exit 1
          fi
      - run: pip install -r requirements.txt ruff
      - run: python -m compileall -q nwol desktop
      - run: ruff check .
      - run: python -m pytest -q
        working-directory: nwol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend
      # Les parcours de bout en bout gardent aussi la release : ce job a déjà
      # Python ET les dépendances backend installés, le serveur peut donc être
      # lancé pour servir le bundle qu'on vient de compiler.
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend

  scans:
    # Pas de `secrets: inherit` : les scans n'ont besoin que du GITHUB_TOKEN, qui
    # est transmis d'office. Hériter aurait exposé les certificats de signature à
    # une action tierce (gitleaks) qui n'en a que faire.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security.yml

  build-macos:
    needs: [checks, scans]
    # Secrets de signature dans l'environnement `release` : le job attend
    # l'approbation manuelle (Actions → Review deployments) avant de les lire.
    environment: release
    # PyInstaller produit un binaire de l'architecture de la machine qui le
    # construit : un .app « universal2 » exigerait des roues universal2 pour
    # TOUTES les dépendances natives (pypdfium2, Pillow…), qui n'existent pas.
    # Deux builds, deux archives.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Dépendances + frontend
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          cd frontend && npm ci && npm run build
      # Mentions des licences tierces, embarquées par la spec. --check refuse
      # une dépendance copyleft ou sans licence avant qu'elle atteigne un binaire.
      - name: Mentions des licences tierces
        run: python scripts/third_party_notices.py --check
      # Le certificat entre dans un trousseau jetable, et PyInstaller signe
      # lui-même CHAQUE binaire collecté puis le bundle (runtime durci,
      # horodatage, desktop/entitlements.plist) : un `codesign --deep` après
      # coup laisse des bibliothèques en signature ad hoc et sans horodatage,
      # que la notarisation refuse.
      - name: Identité Developer ID — si certificat configuré
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::Le certificat ne contient aucune identité « Developer ID Application »"
            exit 1
          fi
          echo "METACAPP_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build PyInstaller (signé si une identité est définie, ad hoc sinon)
        run: pyinstaller desktop/metacapp.spec --noconfirm --distpath dist_app
      - name: Signature cohérente sur tout le bundle
        run: |
          codesign --verify --deep --strict --verbose=2 dist_app/Meta-Capp.app
          if [ -n "$METACAPP_CODESIGN_IDENTITY" ]; then
            codesign -dv dist_app/Meta-Capp.app 2>&1 | tee /dev/stderr | grep -q "runtime" \
              || { echo "::error::runtime durci absent de la signature"; exit 1; }
          fi
      # APRÈS la signature : le runtime durci peut empêcher un binaire signé de
      # démarrer alors que la version ad hoc démarrait. C'est ce binaire-là que
      # les utilisateurs lancent.
      - name: Smoke test du binaire réel (serveur + /api/health)
        run: |
          ./dist_app/Meta-Capp.app/Contents/MacOS/Meta-Capp --server-only &
          SMOKE_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8756/api/health > /dev/null 2>&1; then
              echo "Smoke test OK"; kill $SMOKE_PID; exit 0
            fi
            sleep 2
          done
          echo "Smoke test FAILED : /api/health injoignable"; kill $SMOKE_PID || true; exit 1
      - name: Notarisation + agrafage — si identifiants Apple configurés
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist_app/Meta-Capp.app "$RUNNER_TEMP/notarize.zip"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          else
            AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          fi
          # `--wait` rend la main aussi sur un refus : c'est le statut qui tranche.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" --wait --timeout 1h \
            --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          STATUS=$(python -c "import json, sys; print(json.load(open(sys.argv[1])).get('status', ''))" "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(python -c "import json, sys; print(json.load(open(sys.argv[1])).get('id', ''))" "$RUNNER_TEMP/notary.json")
            [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}"
            rm -f "$RUNNER_TEMP/notary.p8"
            echo "::error::Notarisation refusée (statut : ${STATUS:-inconnu})"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple dist_app/Meta-Capp.app
          xcrun stapler validate dist_app/Meta-Capp.app
          # Ce que Gatekeeper dira chez l'utilisateur : « Notarized Developer ID ».
          spctl --assess --type execute --verbose=2 dist_app/Meta-Capp.app
      - name: Le binaire a l'architecture annoncée
        run: |
          file dist_app/Meta-Capp.app/Contents/MacOS/Meta-Capp | tee /dev/stderr | grep -q "${{ matrix.arch }}"
      - name: Archive de distribution
        run: ditto -c -k --keepParent dist_app/Meta-Capp.app "Meta-Capp-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Meta-Capp-macos-${{ matrix.arch }}
          path: Meta-Capp-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Trousseau de build supprimé
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  build-windows:
    needs: [checks, scans]
    # Secrets de signature dans l'environnement `release` : le job attend
    # l'approbation manuelle (Actions → Review deployments) avant de les lire.
    environment: release
    runs-on: windows-latest
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
      HAS_WIN_SIGNING: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Dépendances + frontend
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          cd frontend
          npm ci
          npm run build
      - name: Mentions des licences tierces
        run: python scripts/third_party_notices.py --check
      - name: Build PyInstaller (BUNDLE macOS ignoré -> dossier COLLECT + exe)
        run: pyinstaller desktop/metacapp.spec --noconfirm --distpath dist_app
      # Azure Artifact Signing : la clé ne quitte jamais le HSM de Microsoft,
      # signtool lui envoie l'empreinte par la dlib officielle (aucune action
      # tierce). Identité : un principal de service (EnvironmentCredential).
      - name: Signature Authenticode (Azure Artifact Signing) — si configurée
        if: env.HAS_WIN_SIGNING == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.128 -x -OutputDirectory "$env:RUNNER_TEMP\signing" | Out-Null
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\signing" -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlib) { Write-Error "Dlib Artifact Signing introuvable"; exit 1 }
          $metadata = "$env:RUNNER_TEMP\signing\metadata.json"
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
            ExcludeCredentials = @(
              "ManagedIdentityCredential", "WorkloadIdentityCredential", "SharedTokenCacheCredential",
              "VisualStudioCredential", "VisualStudioCodeCredential", "AzureCliCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          & $signtool sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib $dlib /dmdf $metadata dist_app\Meta-Capp\Meta-Capp.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $signtool verify /pa /v dist_app\Meta-Capp\Meta-Capp.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test du binaire réel (serveur + /api/health)
        run: |
          $proc = Start-Process -FilePath "dist_app\Meta-Capp\Meta-Capp.exe" -ArgumentList "--server-only" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:8756/api/health" -UseBasicParsing -TimeoutSec 2 | Out-Null
              $ok = $true
              break
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Smoke test FAILED : /api/health injoignable"; exit 1 }
          Write-Host "Smoke test OK"
      - name: Archive de distribution
        run: Compress-Archive -Path dist_app\Meta-Capp -DestinationPath "Meta-Capp-$env:GITHUB_REF_NAME-windows.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Meta-Capp-windows
          path: Meta-Capp-*-windows.zip
          if-no-files-found: error

  build-linux:
    needs: [checks, scans]
    runs-on: ubuntu-22.04
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Dépendances + frontend
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          cd frontend && npm ci && npm run build
      - name: Mentions des licences tierces
        run: python scripts/third_party_notices.py --check
      # La spec exclut les plateformes GTK et Qt de pywebview : geler GTK
      # embarquerait des bibliothèques système liées à CETTE distribution. Le
      # binaire Linux s'ouvre donc toujours dans le navigateur par défaut
      # (desktop/pywebview_main.py:_run_in_browser) ; la fenêtre native reste
      # disponible en installation depuis les sources (README, « Linux: getting
      # a native window »).
      - name: Build PyInstaller
        run: pyinstaller desktop/metacapp.spec --noconfirm --distpath dist_app
      - name: Smoke test du binaire réel (serveur + /api/health)
        run: |
          ./dist_app/Meta-Capp/Meta-Capp --server-only &
          SMOKE_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8756/api/health > /dev/null 2>&1; then
              echo "Smoke test OK"; kill $SMOKE_PID; exit 0
            fi
            sleep 2
          done
          echo "Smoke test FAILED : /api/health injoignable"; kill $SMOKE_PID || true; exit 1
      # tar et non zip : le bit d'exécution doit survivre au téléchargement.
      - name: Archive de distribution
        run: tar -C dist_app -czf "Meta-Capp-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" Meta-Capp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Meta-Capp-linux-x86_64
          path: Meta-Capp-*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    # Publication UNIQUE une fois TOUS les builds verts : un seul job crée la
    # Release, donc pas de course. Un build rouge bloque la publication entière.
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Meta-Capp-*
          merge-multiple: true
      # Empreintes publiées avec les archives : c'est ce qui permet à chacun de
      # vérifier un binaire qui circule, et de prouver qu'un binaire n'est pas le
      # nôtre (architecture/13 § 4).
      - name: Empreintes SHA-256
        run: sha256sum Meta-Capp-*.zip Meta-Capp-*.tar.gz | tee SHA256SUMS.txt
      - name: Publication (canal beta si tag pré-release, sinon stable)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            Meta-Capp-*.zip
            Meta-Capp-*.tar.gz
            SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
