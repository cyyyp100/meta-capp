# CI minimale (P0 du plan de durcissement) — bloque toute PR rouge.
# Ollama n'existe pas en CI : les tests couvrent les chemins de repli/mocks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1" # F9 : pas de conda en CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest-cov
      - name: Syntaxe / imports
        run: python -m compileall -q nwol desktop
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests + couverture (informative, seuil géré hors CI)
        run: python -m pytest -q --cov=services --cov=metacog --cov=db --cov=server --cov-report=term
        working-directory: nwol

  backend-windows:
    # Détecte les régressions spécifiques Windows (chemins, encodage, env vars)
    # à chaque push, pas seulement au tag de release. Lint et couverture restent
    # sur le job ubuntu : ici on ne vérifie que install + compilation + tests.
    runs-on: windows-latest
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntaxe / imports
        run: python -m compileall -q nwol desktop
      - name: Tests
        run: python -m pytest -q
        working-directory: nwol

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest — anti-XSS S6, nonce S1, primitives d'interface)
        run: npm test
      - name: Type-check + build
        run: npm run build

      # Parcours de bout en bout : le bundle compilé ci-dessus est servi par le
      # VRAI backend FastAPI (même montage qu'en production). Ollama est absent
      # en CI : les scénarios s'appuient sur les chemins de repli, déjà couverts
      # côté Python par tests/server/test_llm_fallback.py.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Dépendances backend (pour le serveur des parcours)
        run: pip install -r ../requirements.txt
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout (playwright)
        run: npx playwright test
      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
