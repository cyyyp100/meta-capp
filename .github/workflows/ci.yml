# CI minimale (P0 du plan de durcissement) — bloque toute PR rouge.
# Ollama n'existe pas en CI : les tests couvrent les chemins de repli/mocks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Moindre privilège : ce workflow ne fait que lire le dépôt. Actions épinglées par
# SHA (un tag `@v4` se réécrit, un SHA non) ; Dependabot les tient à jour.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04 # Python 3.11.9 : pas de build pour Ubuntu 26.04 (= ubuntu-latest depuis oct. 2026)
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1" # F9 : pas de conda en CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.9"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest-cov
      - name: Syntaxe / imports
        run: python -m compileall -q nwol desktop
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests + couverture (informative, seuil géré hors CI)
        run: python -m pytest -q --cov=services --cov=metacog --cov=db --cov=server --cov-report=term
        working-directory: nwol

  backend-windows:
    # Détecte les régressions spécifiques Windows (chemins, encodage, env vars)
    # à chaque push, pas seulement au tag de release. Lint et couverture restent
    # sur le job ubuntu : ici on ne vérifie que install + compilation + tests.
    runs-on: windows-latest
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntaxe / imports
        run: python -m compileall -q nwol desktop
      - name: Tests
        run: python -m pytest -q
        working-directory: nwol

  frontend:
    runs-on: ubuntu-24.04 # Python 3.11.9 : pas de build pour Ubuntu 26.04 (= ubuntu-latest depuis oct. 2026)
    defaults:
      run:
        working-directory: frontend
    env:
      NWOL_DISABLE_CONDA_REEXEC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest — anti-XSS S6, nonce S1, primitives d'interface)
        run: npm test
      - name: Type-check + build
        run: npm run build

      # Parcours de bout en bout : le bundle compilé ci-dessus est servi par le
      # VRAI backend FastAPI (même montage qu'en production). Ollama est absent
      # en CI : les scénarios s'appuient sur les chemins de repli, déjà couverts
      # côté Python par tests/server/test_llm_fallback.py.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Dépendances backend (pour le serveur des parcours)
        run: pip install -r ../requirements.txt
      # Les deux arbres de dépendances sont installés ici : c'est l'endroit où
      # refuser, dès la PR, une dépendance copyleft ou sans licence déclarée.
      - name: Licences des dépendances (Python + npm)
        run: python scripts/third_party_notices.py --check
        working-directory: ${{ github.workspace }}
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout (playwright)
        run: npx playwright test
      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
