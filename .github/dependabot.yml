# Dependabot (S5) : PRs automatiques sur les dépendances vulnérables/obsolètes.
# Les mises à jour mineures et correctives sont groupées (une PR par écosystème
# et par semaine) ; les versions majeures restent seules, pour être lues une à une.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
